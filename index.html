<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQ2 Practice 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-image: url("https://i.pinimg.com/originals/56/e9/36/56e9367fa1d4ec7a49a23cbe9f979c0c.gif");
            background-size: cover;
            background-repeat: no-repeat;
        }
        h1{
            font-family: Chiller;
            font-size: 50px;
            background-color:rgb(243, 146, 27);
            color:rgb(255, 240, 153);
            border-radius: 15px;
            box-shadow: 6px 9px 10px white;
        }
        #halloween{
            height: 380px;
            width: 380px;
        }
        #table1{
            background-color: rgba(255, 196, 48, 0.677);
            padding: 5px;
        }
        table{
            border: 5px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="text-center">9 Sapphire Halloween Party 2026</h1>
            </div>
        </div>

        <br>
        <img src="https://media.tenor.com/Yzly_CmNUTAAAAAM/dancing-dance.gif" alt="halloween" id="halloween" class="img-fluid mx-auto d-block">
        <br>

        <div class="row justify-content-center">
            <div class="col-lg-8" id="table1">
                <table class="table-hover table-bordered align-middle text-center border-white">
                    <thead>
                        <tr class="display-6">
                            <th scope="col" style="width: 13%;">SATURDAY</th>
                            <th scope="col" style="width: 10%;">31</th>
                            <th scope="col" style= "width: 10%;">OCTOBER</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="display-6 bg-danger" id="row2">
                            <td colspan="3">4:44 PM</td>
                        </tr>

                        <tr class="display-6 bg-warning" id="row3">
                            <td colspan="2">666 Further Avenue Spooky Street Scary Village Nightmare City</td>
                            <td>RVSP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
